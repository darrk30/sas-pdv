# ── Exclusiones de análisis ──────────────────────────────────────────────────

# Ignora archivos generados, vendor y assets compilados
sonar.exclusions=\
  vendor/**,\
  node_modules/**,\
  public/build/**,\
  public/vendor/**,\
  storage/**,\
  bootstrap/cache/**

# ── Silenciar reglas de baja prioridad ───────────────────────────────────────
#
# javascript:S3533 — parseInt vs Number.parseInt (estilístico, sin riesgo real)
# Web:S1500        — Encabezados vacíos (Blade genera contenido dinámico con Livewire/Alpine)
# Web:S5843        — autofocus (intencional en formularios de login)
# Web:S5849        — Elementos interactivos no nativos (Alpine.js usa divs con @click)
# php:S1192        — Literales duplicados (ruidoso; los casos restantes son intencionales)

sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5

# parseInt / parseFloat en JS público de la tienda
sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S3533
sonar.issue.ignore.multicriteria.e1.resourceKey=public/tienda/js/**

# Encabezados vacíos en Blade (contenido generado dinámicamente)
sonar.issue.ignore.multicriteria.e2.ruleKey=Web:S1500
sonar.issue.ignore.multicriteria.e2.resourceKey=resources/views/**

# autofocus en formularios de autenticación (comportamiento intencional)
sonar.issue.ignore.multicriteria.e3.ruleKey=Web:S5843
sonar.issue.ignore.multicriteria.e3.resourceKey=resources/views/livewire/tienda/auth/**

# Elementos interactivos con Alpine.js / Livewire
sonar.issue.ignore.multicriteria.e4.ruleKey=Web:S5849
sonar.issue.ignore.multicriteria.e4.resourceKey=resources/views/**

# Literales duplicados PHP (los restantes son intencionales o de refactor futuro)
sonar.issue.ignore.multicriteria.e5.ruleKey=php:S1192
sonar.issue.ignore.multicriteria.e5.resourceKey=app/**
